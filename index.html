<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의료 판례 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6675; --line:#D6DCE3; --soft:#F5F7F9;
  --accent:#2B4C7E; --against:#B4442F; --for:#2F7D5B; --mixed:#9A6510;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --surface:#19212B; --ink:#E6EBF1; --muted:#9AA6B4; --line:#2B3542; --soft:#141B23;
    --accent:#8FB1E3; --against:#F08A73; --for:#6FD0A2; --mixed:#E6B45C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#19212B; --ink:#E6EBF1; --muted:#9AA6B4; --line:#2B3542; --soft:#141B23;
  --accent:#8FB1E3; --against:#F08A73; --for:#6FD0A2; --mixed:#E6B45C; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15.5px; line-height:1.75; -webkit-font-smoothing:antialiased; word-break:keep-all}
.wrap{max-width:560px; margin:0 auto; padding:22px 16px 110px}
header h1{font-family:"Gowun Batang",serif; font-size:26px; line-height:1.25; margin:0 0 4px; font-weight:700}
header p{margin:0; color:var(--muted); font-size:14px; line-height:1.6}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.card{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 18px 20px}
.meta{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 4px}
.meta div{background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:9px 12px}
.meta dt{font-size:12px; color:var(--muted); margin:0}
.meta dd{margin:0; font-size:15px; font-weight:700; line-height:1.4}
.meta dd small{display:block; font-size:12.5px; font-weight:400; color:var(--muted)}
.foot{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-top:22px}
.stamp{--red:#C8102E; flex:none; transform:rotate(-8deg); color:var(--red); border:3px solid var(--red); border-radius:10px;
  padding:6px 12px 5px; text-align:center; box-shadow:inset 0 0 0 2px var(--surface), inset 0 0 0 4px var(--red); opacity:.9; max-width:52%}
.stamp b{display:block; font-family:"Gowun Batang",serif; font-size:21px; line-height:1.2; letter-spacing:.04em}
.stamp span{display:block; font-size:11.5px; font-weight:600; line-height:1.35; margin-top:2px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stamp{--red:#FF6B7D} }
:root[data-theme="dark"] .stamp{--red:#FF6B7D}
.title{font-family:"Gowun Batang",serif; font-size:22px; line-height:1.45; font-weight:700; margin:0 0 14px}
.sec{margin-top:16px}
.sec h3{font-size:13.5px; font-weight:700; color:var(--accent); margin:0 0 4px}
.sec p{margin:0}
.tip{margin-top:22px; background:var(--soft); border-left:4px solid var(--accent); border-radius:0 12px 12px 0; padding:12px 14px}
.tip h3{font-size:13.5px; font-weight:700; margin:0 0 4px; color:var(--ink)}
.tip p{margin:0}
.source{margin:0; font-size:12.5px; color:var(--muted)}

.nav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center}
.nav button{font:inherit; font-size:15px; font-weight:600; border-radius:12px; padding:11px 12px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.nav button.next{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.nav button:disabled{opacity:.4; cursor:default}
.count{font-size:13px; color:var(--muted); text-align:center; min-width:64px}
footer{margin-top:22px; font-size:12px; color:var(--muted); line-height:1.7}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion: no-preference){ .card{animation:in .25s ease} @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>의료 판례 모음</h1>
    <p>의사라면 알아 두면 좋은 의료 판례를 쉬운 말로 모았어요. 하나씩 넘겨 보세요.</p>
  </header>
  <main id="card" aria-live="polite"></main>
  <footer>
    <p>법제처 국가법령정보센터에 공개된 판결문을 쉬운 말로 정리한 거예요. 실제 판단은 사건마다 달라질 수 있어요.</p>
    <p>법률 자문이 아니에요. 구체적인 상황은 변호사와 상담하세요.</p>
  </footer>
</div>
<nav class="nav" aria-label="판례 넘기기">
  <div class="nav-in">
    <button type="button" id="prev">이전</button>
    <button type="button" class="next" id="next">다음</button>
  </div>
</nav>

<script src="cases.js"></script>
<script>
const CASES = window.PANRYE || [];
const KIND_NOTE = {
  "의료사고 민사": "환자 측이 손해배상을 청구한 소송",
  "의료사고 형사": "의료진의 업무상 과실을 처벌할지 다툰 재판",
  "의료법 위반": "의료법을 어겼는지 다툰 형사재판",
  "건강보험법 위반": "요양급여를 부당하게 받았는지 다툰 형사재판",
  "의료 행정소송": "면허정지, 업무정지, 환수 같은 처분을 다툰 소송",
  "법령해석": "법제처가 의료 관련 법을 어떻게 읽어야 하는지 답한 것"
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmt = d => `${d.slice(0,4)}. ${Number(d.slice(4,6))}. ${Number(d.slice(6,8))}.`;

// 열 때마다 순서를 섞어서, 무작위로 하나씩 보여줘요
const order = CASES.map((_, i) => i);
for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
let pos = 0;

function render(){
  const el = document.getElementById("card");
  if (!CASES.length){ el.innerHTML = '<article class="card">판례를 준비하고 있어요.</article>'; return; }
  const c = CASES[order[pos]];
  el.innerHTML = `<article class="card">
    <h2 class="title">${esc(c.title)}</h2>
    <dl class="meta">
      <div><dt>사건 종류</dt><dd>${esc(c.kind)}<small>${esc(KIND_NOTE[c.kind] || "")}</small></dd></div>
      <div><dt>진료과</dt><dd>${esc(c.dept)}</dd></div>
    </dl>
    <div class="sec"><h3>무슨 일이 있었나</h3><p>${esc(c.story)}</p></div>
    <div class="sec"><h3>법원은 이렇게 봤어요</h3><p>${esc(c.view)}</p></div>
    <div class="foot">
      <p class="source">${c.kind === "법령해석"
        ? `${esc(c.court)} 법령해석<br>${fmt(c.date)} 회신 ${esc(c.caseNo)}`
        : `${esc(c.court)} ${fmt(c.date)} 선고<br>${esc(c.caseNo)} 판결`}</p>
      <div class="stamp" aria-label="판결 결과: ${esc(c.result.stamp)}, ${esc(c.result.sub)}"><b>${esc(c.result.stamp)}</b><span>${esc(c.result.sub)}</span></div>
    </div>
    <div class="tip"><h3>진료실에서 기억할 점</h3><p>${esc(c.tip)}</p></div>
  </article>`;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").textContent = pos === CASES.length - 1 ? "처음으로" : "다음";
}
function go(step){
  pos = (pos + step + CASES.length) % CASES.length;
  render();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
}
document.getElementById("prev").addEventListener("click", () => { if (pos > 0) go(-1); });
document.getElementById("next").addEventListener("click", () => go(1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft" && pos > 0) go(-1);
});
render();
</script>
</body>
</html>
